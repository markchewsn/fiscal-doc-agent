[project]
name = "fiscal-doc-agent"
version = "0.1.0"
description = "LLM extraction and agents over MOF FY2024 Analysis of Revenue and Expenditure"
authors = [
    { name = "markchewsn", email = "mark.chew@simplifynext.com" }
]
requires-python = ">=3.12"
dependencies = [
    "botocore>=1.43.123",
    "deepagents>=0.7.32",
    "langchain>=1.4.8",
    "langchain-aws>=1.9.1",
    "langchain-core>=1.7.4",
    "langchain-mcp-adapters>=0.3.1",
    "mcp>=1.2,<2",
    "pydantic>=2.14.2",
    "pymupdf4llm>=2.1",
    "python-dateutil>=2.9.0.post0",
    "python-dotenv>=1.2.4",
]

[build-system]
requires = ["uv_build>=0.10.6,<0.11.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=9.2.0",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
